<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- 24K Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Soft Gold Gradient -->
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Circle -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.8" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5" />

  <!-- Botanical Laurel Wreath / Leaves Around Inner Border -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 85 240 C 70 210, 95 180, 115 190 C 100 210, 95 230, 85 240 Z" />
    <path d="M 95 190 C 85 160, 115 135, 132 150 C 115 170, 110 185, 95 190 Z" />
    <path d="M 120 145 C 115 115, 145 95, 160 115 C 142 132, 135 142, 120 145 Z" />
    <path d="M 155 110 C 158 80, 190 70, 200 92 C 180 105, 172 110, 155 110 Z" />
    
    <!-- Right Leaves -->
    <path d="M 427 240 C 442 210, 417 180, 397 190 C 412 210, 417 230, 427 240 Z" />
    <path d="M 417 190 C 427 160, 397 135, 380 150 C 397 170, 402 185, 417 190 Z" />
    <path d="M 392 145 C 397 115, 367 95, 352 115 C 370 132, 377 142, 392 145 Z" />
    <path d="M 357 110 C 354 80, 322 70, 312 92 C 332 105, 340 110, 357 110 Z" />
  </g>

  <!-- Crown / Crescent at Top -->
  <g transform="translate(256, 75)" filter="url(#goldGlow)">
    <!-- Crescent & Star -->
    <path d="M 0 -22 C -18 -22, -32 -8, -32 12 C -32 28, -20 42, -5 45 C -15 36, -20 25, -20 12 C -20 -4, -10 -15, 2 -17 C 0 -19, -0.5 -21, 0 -22 Z" fill="url(#goldGrad)" transform="scale(0.7) translate(-10, -10)" />
    <polygon points="12,-2 15,6 23,6 17,11 19,19 12,14 5,19 7,11 1,6 9,6" fill="url(#goldGrad)" transform="scale(0.7)" />
  </g>

  <!-- Centerpiece: Mortar & Pestle (ہاون دستہ) with Sprouting Herbs -->
  <g transform="translate(256, 215)">
    <!-- Aura behind Mortar -->
    <circle cx="0" cy="0" r="85" fill="#047857" opacity="0.4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

    <!-- Sprouting Medicinal Herbs (Leaves) -->
    <path d="M 0 -25 C -40 -65, -15 -100, 0 -95 C 15 -100, 40 -65, 0 -25 Z" fill="url(#leafGrad)" stroke="url(#softGold)" stroke-width="1.5" />
    <path d="M 0 -95 L 0 -25" stroke="url(#softGold)" stroke-width="1.5" />
    
    <!-- Left Leaf -->
    <path d="M -10 -35 C -55 -55, -60 -85, -40 -90 C -25 -80, -20 -55, -10 -35 Z" fill="url(#leafGrad)" stroke="url(#softGold)" stroke-width="1" />
    <!-- Right Leaf -->
    <path d="M 10 -35 C 55 -55, 60 -85, 40 -90 C 25 -80, 20 -55, 10 -35 Z" fill="url(#leafGrad)" stroke="url(#softGold)" stroke-width="1" />

    <!-- Pestle (دستہ) -->
    <path d="M -18 -65 L 32 15 C 36 22, 28 28, 20 25 L -30 -55 C -35 -62, -24 -70, -18 -65 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    
    <!-- Mortar Bowl (کھرل / پیالہ) -->
    <path d="M -60 -10 C -65 35, -45 55, 0 58 C 45 55, 65 35, 60 -10 C 50 -5, 25 0, 0 0 C -25 0, -50 -5, -60 -10 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    
    <!-- Mortar Base & Rim Trim -->
    <ellipse cx="0" cy="-10" rx="60" ry="12" fill="url(#softGold)" opacity="0.9" />
    <ellipse cx="0" cy="-10" rx="52" ry="9" fill="#064e3b" />
    
    <!-- Decorative Carvings on Mortar -->
    <path d="M -40 20 Q 0 35 40 20" fill="none" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="28" r="4" fill="#78350f" />
    <circle cx="-20" cy="24" r="3" fill="#78350f" />
    <circle cx="20" cy="24" r="3" fill="#78350f" />

    <!-- Base Pedestal -->
    <path d="M -35 55 L -45 68 L 45 68 L 35 55 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Main Urdu Calligraphy Title: الشہزاد دواخانہ -->
  <!-- Rendered with crisp high-clarity typography paths -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)" text-anchor="middle">
    <text x="256" y="348" font-family="'Noto Nastaliq Urdu', 'Amiri', 'Noto Sans Arabic', serif" font-size="44" font-weight="bold" letter-spacing="1">الشہزاد دواخانہ</text>
    <text x="256" y="388" font-family="'Noto Sans Arabic', 'Amiri', sans-serif" font-size="19" font-weight="600" fill="url(#softGold)" letter-spacing="2">اینڈ ہربل کلینک</text>
  </g>

  <!-- English Subtitle Banner Ribbon -->
  <g transform="translate(256, 422)">
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#022c22" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="url(#softGold)" text-anchor="middle" letter-spacing="2.5">TIBB-E-UNANI &amp; HERBAL CLINIC</text>
  </g>

  <!-- Heritage Badge at Bottom -->
  <text x="256" y="468" font-family="'Noto Sans Arabic', sans-serif" font-size="13" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" opacity="0.9">خالص قدرتی جڑی بوٹیوں سے مستند علاج</text>
</svg>
