    <!-- Google Chrome PWA Event Capture & Instant Service Worker Auto-Update -->
    <script>
      window.deferredPrompt = null;
      window.deferredPwaPrompt = null;

      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.deferredPwaPrompt = e;
        console.log("[PWA] Al-Shehzad Dawakhana install prompt ready");
        window.dispatchEvent(new CustomEvent("pwa-ready"));
      });

      window.addEventListener("appinstalled", function() {
        console.log("[PWA] Al-Shehzad Dawakhana installed successfully!");
        window.deferredPrompt = null;
        window.deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent("pwa-installed"));
      });
    </script>

    <script>
      // Instantly unregister all stale Service Workers and purge browser caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
