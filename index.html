    <!-- Silent Chrome PWA beforeinstallprompt Capture & Service Worker Registration -->
    <script>
      window.deferredPrompt = null;

      // 1. Intercept beforeinstallprompt silently and save the event
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      // 2. Clear event when app is installed
      window.addEventListener('appinstalled', function() {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // 3. Register minimal active Service Worker for Chrome PWA Criteria
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('ServiceWorker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.log('ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
